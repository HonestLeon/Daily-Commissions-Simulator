<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>轻量便签 - 在线交互 Demo</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --bg-wallpaper: radial-gradient(circle at 20% 30%, #a8c0ff 0%, transparent 40%),
                      radial-gradient(circle at 80% 70%, #fbc2eb 0%, transparent 40%),
                      linear-gradient(135deg, #f4f6f8 0%, #e2e8f0 100%);
      --app-radius: 10px;
      --accent: #4a9eff;
      --accent-dark: #ffb347;
      --text: #1e1e1e;
      --text-secondary: #666;
      --border-light: rgba(255, 255, 255, 0.45);
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
      --opacity: 0.92;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #121212;
      --bg-wallpaper: radial-gradient(circle at 20% 30%, #1a237e 0%, transparent 40%),
                      radial-gradient(circle at 80% 70%, #4a148c 0%, transparent 40%),
                      linear-gradient(135deg, #121212 0%, #1e1e1e 100%);
      --text: #e0e0e0;
      --text-secondary: #aaa;
      --border-light: rgba(255, 255, 255, 0.08);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", sans-serif;
      background: var(--bg-wallpaper);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wallpaper-hint {
      position: fixed;
      bottom: 12px;
      right: 16px;
      font-size: 12px;
      color: var(--text-secondary);
      opacity: 0.7;
      pointer-events: none;
    }

    .app-window {
      width: 960px;
      max-width: 96vw;
      height: 640px;
      max-height: 90vh;
      border-radius: var(--app-radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: opacity 0.2s;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(28px) saturate(1.2);
      -webkit-backdrop-filter: blur(28px) saturate(1.2);
    }

    [data-theme="dark"] .app-window {
      background: rgba(30, 30, 30, 0.5);
    }

    /* Title Bar */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      padding: 0 10px;
      background: rgba(245, 245, 245, calc(0.6 * var(--opacity)));
      border-bottom: 1px solid var(--border-light);
      flex-shrink: 0;
    }

    [data-theme="dark"] .titlebar {
      background: rgba(30, 30, 30, calc(0.65 * var(--opacity)));
    }

    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .titlebar-icon {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      background: linear-gradient(135deg, #4a9eff, #6ac6ff);
    }

    .titlebar-controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .titlebar-btn {
      width: 30px;
      height: 26px;
      border: none;
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-size: 14px;
      transition: background 0.15s, color 0.15s;
    }

    .titlebar-btn:hover { background: rgba(0,0,0,0.07); }
    [data-theme="dark"] .titlebar-btn:hover { background: rgba(255,255,255,0.1); }

    .titlebar-btn.active { color: #e67e22; background: rgba(230,126,34,0.12); }

    .opacity-slider {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 6px;
    }

    .opacity-slider input[type="range"] {
      width: 80px;
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: #ccc;
      border-radius: 2px;
      outline: none;
    }

    [data-theme="dark"] .opacity-slider input[type="range"] { background: #555; }

    .opacity-slider input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #666;
      cursor: pointer;
    }

    .opacity-value {
      font-size: 11px;
      min-width: 34px;
      text-align: right;
      color: var(--text-secondary);
    }

    /* App Body */
    .app-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 180px;
      min-width: 180px;
      background: rgba(243, 244, 246, calc(0.5 * var(--opacity)));
      border-right: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      transition: width 0.2s;
    }

    [data-theme="dark"] .sidebar {
      background: rgba(25, 25, 25, calc(0.55 * var(--opacity)));
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sidebar-search {
      padding: 8px;
      border-bottom: 1px solid rgba(0,0,0,0.06);
    }

    .sidebar-search input {
      width: 100%;
      padding: 6px 10px;
      font-size: 12px;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 6px;
      outline: none;
      background: rgba(255,255,255,0.55);
      color: var(--text);
    }

    [data-theme="dark"] .sidebar-search input {
      background: rgba(40,40,40,0.6);
      border-color: rgba(255,255,255,0.1);
      color: #ddd;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
    }

    .sidebar-group { margin-bottom: 6px; }

    .sidebar-group-header {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      user-select: none;
    }

    .sidebar-group-header:hover { background: rgba(0,0,0,0.04); }
    [data-theme="dark"] .sidebar-group-header:hover { background: rgba(255,255,255,0.05); }

    .sidebar-group-name { flex: 1; }
    .sidebar-group-count {
      font-size: 10px;
      background: rgba(0,0,0,0.06);
      padding: 1px 6px;
      border-radius: 8px;
    }
    [data-theme="dark"] .sidebar-group-count { background: rgba(255,255,255,0.08); }

    .sidebar-item {
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.15s;
      position: relative;
    }

    .sidebar-item:hover { background: rgba(255,255,255,0.5); }
    [data-theme="dark"] .sidebar-item:hover { background: rgba(255,255,255,0.07); }

    .sidebar-item.active {
      background: rgba(255,255,255,0.7);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    [data-theme="dark"] .sidebar-item.active { background: rgba(255,255,255,0.11); }

    .sidebar-item.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 3px;
      border-radius: 0 2px 2px 0;
      background: var(--accent);
    }

    .sidebar-item-title {
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-item-date {
      font-size: 11px;
      color: #999;
      margin-top: 2px;
    }

    .sidebar-footer {
      padding: 10px;
      border-top: 1px solid rgba(0,0,0,0.06);
    }

    .create-btn {
      width: 100%;
      padding: 8px;
      border: 1px dashed rgba(0,0,0,0.15);
      border-radius: 6px;
      background: rgba(255,255,255,0.4);
      font-size: 13px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s;
    }

    .create-btn:hover {
      background: rgba(255,255,255,0.7);
      border-color: rgba(0,0,0,0.25);
    }

    /* Editor */
    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, calc(0.72 * var(--opacity)));
      overflow: hidden;
      position: relative;
    }

    [data-theme="dark"] .editor-area {
      background: rgba(20, 20, 20, calc(0.72 * var(--opacity)));
    }

    .editor-placeholder {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #aaa;
    }

    .editor-content {
      flex: 1;
      padding: 20px 28px;
      overflow-y: auto;
      font-size: 15px;
      line-height: 1.7;
      outline: none;
    }

    .editor-content h1, .editor-content h2, .editor-content h3 {
      margin: 6px 0 12px;
      font-weight: 600;
    }

    .editor-content h1 { font-size: 22px; border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 8px; }
    .editor-content h2 { font-size: 18px; }
    .editor-content h3 { font-size: 16px; }
    .editor-content h4 { font-size: 14px; color: var(--text-secondary); }

    .editor-content ul { padding-left: 22px; margin: 8px 0; }
    .editor-content li { margin: 4px 0; }

    .editor-content input[type="checkbox"] {
      margin-right: 8px;
      cursor: pointer;
    }

    .save-status {
      position: absolute;
      bottom: 10px;
      right: 14px;
      font-size: 11px;
      color: #999;
      background: rgba(255,255,255,0.9);
      padding: 2px 10px;
      border-radius: 10px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.25);
      z-index: 200;
      display: none;
    }

    .modal-panel {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      max-width: 90vw;
      max-height: 80vh;
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(30px);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.5);
      z-index: 201;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    [data-theme="dark"] .modal-panel {
      background: rgba(40,40,40,0.94);
      border-color: rgba(255,255,255,0.1);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      font-weight: 600;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 16px;
      cursor: pointer;
      color: #888;
    }

    .modal-body { padding: 14px 18px 20px; overflow-y: auto; }

    .template-option {
      display: block;
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 8px;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 8px;
      background: rgba(255,255,255,0.6);
      text-align: left;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .template-option:hover {
      background: rgba(74,158,255,0.08);
      border-color: rgba(74,158,255,0.3);
    }

    .template-option-title { font-weight: 500; }
    .template-option-desc { font-size: 12px; color: #999; margin-top: 3px; }

    .template-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      font-size: 10px;
      font-weight: 600;
      color: var(--accent);
      background: rgba(74,158,255,0.1);
      border-radius: 4px;
      vertical-align: middle;
    }

    /* Inheritance highlight */
    .inherited {
      background: linear-gradient(90deg, rgba(74,158,255,0.12), transparent);
      border-radius: 4px;
      padding: 2px 0;
      animation: fadeIn 0.8s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; background: rgba(74,158,255,0.3); }
      to { opacity: 1; background: linear-gradient(90deg, rgba(74,158,255,0.12), transparent); }
    }

    .inherit-hint {
      position: fixed;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(74, 158, 255, 0.92);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .inherit-hint.show { opacity: 1; }

    /* Intro tooltip */
    .intro-toast {
      position: fixed;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(30,30,30,0.92);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-size: 14px;
      z-index: 300;
      box-shadow: 0 8px 32px rgba(0,0,0,0.25);
      max-width: 520px;
      text-align: center;
      line-height: 1.6;
    }

    .intro-toast button {
      margin-top: 10px;
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
    }

    .feature-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 8px;
    }

    .feature-tags span {
      background: rgba(255,255,255,0.15);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }

    @media (max-width: 720px) {
      .sidebar { width: 150px; min-width: 150px; }
      .editor-content { padding: 14px; }
      .opacity-slider { display: none; }
    }
  </style>
</head>
<body data-theme="light">
  <div class="wallpaper-hint">背景仅用于展示 Acrylic 半透明效果 · Demo 数据保存在内存中</div>

  <div class="intro-toast" id="introToast">
    <div>👋 欢迎来到 <strong>轻量便签</strong> 在线交互 Demo</div>
    <div class="feature-tags">
      <span>Markdown 便签</span>
      <span>每日待办智能继承</span>
      <span>模板系统</span>
      <span>Acrylic 半透明</span>
    </div>
    <button onclick="dismissIntro()">开始体验</button>
  </div>

  <div class="inherit-hint" id="inheritHint">✨ 已从上一条「每日待办」智能继承未完成项</div>

  <div class="app-window" id="appWindow">
    <!-- Title Bar -->
    <div class="titlebar">
      <div class="titlebar-left">
        <div class="titlebar-icon"></div>
        <span>轻量便签</span>
      </div>
      <div class="titlebar-controls">
        <button class="titlebar-btn" id="pinBtn" title="置顶" onclick="togglePin()">📌</button>
        <div class="opacity-slider" title="透明度">
          <input type="range" min="25" max="100" value="92" id="opacityRange" oninput="setOpacity(this.value)">
          <span class="opacity-value" id="opacityValue">92%</span>
        </div>
        <button class="titlebar-btn" title="切换主题" onclick="toggleTheme()">🌙</button>
        <button class="titlebar-btn" title="最小化">─</button>
        <button class="titlebar-btn" title="关闭">✕</button>
      </div>
    </div>

    <!-- Body -->
    <div class="app-body">
      <!-- Sidebar -->
      <div class="sidebar">
        <div class="sidebar-header">
          <span>便签列表</span>
        </div>
        <div class="sidebar-search">
          <input type="text" placeholder="搜索便签...">
        </div>
        <div class="sidebar-list" id="sidebarList"></div>
        <div class="sidebar-footer">
          <button class="create-btn" onclick="openTemplatePicker()">＋ 新建便签</button>
        </div>
      </div>

      <!-- Editor -->
      <div class="editor-area">
        <div class="editor-content" id="editorContent"></div>
        <div class="save-status" id="saveStatus"></div>
      </div>
    </div>
  </div>

  <!-- Template Picker Modal -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeTemplatePicker()"></div>
  <div class="modal-panel" id="templatePicker">
    <div class="modal-header">
      <span>新建便签 — 选择模板</span>
      <button class="modal-close" onclick="closeTemplatePicker()">✕</button>
    </div>
    <div class="modal-body">
      <button class="template-option template-option-blank" onclick="createNote(null)">
        <div class="template-option-title">空白便签</div>
        <div class="template-option-desc">从零开始</div>
      </button>
      <div class="template-option" onclick="createNote('daily')">
        <div class="template-option-title">📋 每日待办 <span class="template-badge">预设</span></div>
        <div class="template-option-desc">必做/学习/工作/生活/其他，自动继承昨日未完成</div>
      </div>
      <div class="template-option" onclick="createNote('meeting')">
        <div class="template-option-title">📋 会议记录 <span class="template-badge">预设</span></div>
        <div class="template-option-desc">日期、参会人、议题、决议、待办</div>
      </div>
      <div class="template-option" onclick="createNote('weekly')">
        <div class="template-option-title">📋 周计划 <span class="template-badge">预设</span></div>
        <div class="template-option-desc">本周目标与周一至周五任务</div>
      </div>
    </div>
  </div>

  <script>
    const templates = {
      daily: {
        name: "每日待办",
        content: "### 每日待办\n\n#### 必做\n\n- [ ] \n\n#### 学习/工作\n\n- [ ] \n\n#### 生活\n\n- [ ] \n\n#### 其他\n\n- [ ] \n"
      },
      meeting: {
        name: "会议记录",
        content: "# 会议记录\n\n**日期：**  \n**参会人：**  \n\n## 议题\n\n- \n\n## 决议\n\n- \n\n## 待办\n\n- [ ] \n"
      },
      weekly: {
        name: "周计划",
        content: "# 周计划\n\n## 本周目标\n\n- \n\n## 周一\n- [ ] \n## 周二\n- [ ] \n## 周三\n- [ ] \n## 周四\n- [ ] \n## 周五\n- [ ] \n"
      }
    };

    // Seed data: yesterday's daily todo
    const seedNotes = [
      {
        id: "n1",
        title: "每日待办0624",
        templateId: "daily",
        updatedAt: "2026-06-24T22:30:00",
        content: "### 每日待办\n\n#### 必做\n\n- [x] 晨会同步\n- [ ] 提交日报\n\n#### 学习/工作\n\n- [x] 完成 PR 审查\n- [ ] 整理 TRAE 参赛材料\n\n#### 生活\n\n- [x] 取快递\n- [ ] 买水果\n\n#### 其他\n\n- [x] 预约体检\n- [ ] 还书\n"
      },
      {
        id: "n2",
        title: "会议记录",
        templateId: "meeting",
        updatedAt: "2026-06-24T16:00:00",
        content: "# 会议记录\n\n**日期：** 2026-06-24  \n**参会人：** 产品、研发、设计  \n\n## 议题\n\n- 参赛 Demo 形态与入口\n\n## 决议\n\n- 优先完成单文件 HTML Demo\n\n## 待办\n\n- [ ] 准备 GitHub Pages 部署\n"
      }
    ];

    let notes = JSON.parse(JSON.stringify(seedNotes));
    let activeId = "n1";
    let nextId = 3;
    let isPinned = false;

    function renderSidebar() {
      const list = document.getElementById('sidebarList');
      const groups = {};

      notes.forEach(note => {
        const key = note.templateId || '__blank';
        if (!groups[key]) groups[key] = [];
        groups[key].push(note);
      });

      const groupNames = {
        '__blank': '空白便签',
        'daily': '每日待办',
        'meeting': '会议记录',
        'weekly': '周计划'
      };

      let html = '';
      Object.keys(groups).forEach(key => {
        const name = groupNames[key] || '自定义模板';
        html += `<div class="sidebar-group">
          <div class="sidebar-group-header">
            <span>▼</span>
            <span class="sidebar-group-name">${name}</span>
            <span class="sidebar-group-count">${groups[key].length}</span>
          </div>
          <div class="sidebar-group-items">`;
        groups[key].forEach(note => {
          html += `<div class="sidebar-item ${note.id === activeId ? 'active' : ''}" onclick="setActive('${note.id}')">
            <div class="sidebar-item-title">${note.title}</div>
            <div class="sidebar-item-date">${formatDate(note.updatedAt)}</div>
          </div>`;
        });
        html += '</div></div>';
      });

      list.innerHTML = html;
    }

    function formatDate(iso) {
      const d = new Date(iso);
      const now = new Date();
      const diff = now - d;
      if (diff < 86400000) {
        return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      }
      return `${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function renderEditor() {
      const note = notes.find(n => n.id === activeId);
      const editor = document.getElementById('editorContent');
      if (!note) {
        editor.innerHTML = '<div class="editor-placeholder"><p>选择或创建一个便签开始编辑</p></div>';
        return;
      }
      editor.innerHTML = markdownToHtml(note.content, note._highlightInherit);
      if (note._highlightInherit) {
        delete note._highlightInherit;
        setTimeout(() => {
          document.querySelectorAll('.inherited').forEach(el => {
            el.classList.remove('inherited');
          });
        }, 2200);
      }
    }

    function markdownToHtml(md, highlightInherit) {
      let html = '';
      const lines = md.split('\n');
      let inList = false;
      let listType = null;

      function closeList() {
        if (!inList) return;
        html += listType === 'ol' ? '</ol>' : '</ul>';
        inList = false;
        listType = null;
      }

      lines.forEach((line, idx) => {
        const trimmed = line.trim();

        // Headings
        if (trimmed.startsWith('# ')) { closeList(); html += `<h1>${escapeHtml(trimmed.slice(2))}</h1>`; return; }
        if (trimmed.startsWith('## ')) { closeList(); html += `<h2>${escapeHtml(trimmed.slice(3))}</h2>`; return; }
        if (trimmed.startsWith('### ')) { closeList(); html += `<h3>${escapeHtml(trimmed.slice(4))}</h3>`; return; }
        if (trimmed.startsWith('#### ')) { closeList(); html += `<h4>${escapeHtml(trimmed.slice(5))}</h4>`; return; }

        // Empty line
        if (trimmed === '') { closeList(); html += '<br>'; return; }

        // Task list / unordered list
        const taskMatch = trimmed.match(/^([-*]) \[([ x])\] (.*)$/);
        if (taskMatch) {
          if (!inList || listType !== 'ul') { closeList(); html += '<ul>'; inList = true; listType = 'ul'; }
          const checked = taskMatch[2] === 'x' ? 'checked' : '';
          const text = escapeHtml(taskMatch[3]);
          const hl = highlightInherit && checked !== 'checked' && text ? 'class="inherited"' : '';
          html += `<li ${hl}><label><input type="checkbox" ${checked} disabled> ${boldInline(text)}</label></li>`;
          return;
        }

        const bulletMatch = trimmed.match(/^([-*]) (.*)$/);
        if (bulletMatch) {
          if (!inList || listType !== 'ul') { closeList(); html += '<ul>'; inList = true; listType = 'ul'; }
          html += `<li>${boldInline(escapeHtml(bulletMatch[2]))}</li>`;
          return;
        }

        // Bold text
        closeList();
        html += `<p>${boldInline(escapeHtml(trimmed))}</p>`;
      });

      closeList();
      return html;
    }

    function boldInline(text) {
      return text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function setActive(id) {
      activeId = id;
      renderSidebar();
      renderEditor();
    }

    function openTemplatePicker() {
      document.getElementById('modalOverlay').style.display = 'block';
      document.getElementById('templatePicker').style.display = 'flex';
    }

    function closeTemplatePicker() {
      document.getElementById('modalOverlay').style.display = 'none';
      document.getElementById('templatePicker').style.display = 'none';
    }

    function createNote(templateKey) {
      closeTemplatePicker();
      const now = new Date();
      const iso = now.toISOString();
      const id = 'n' + nextId++;
      let content, title, templateId = null;

      if (templateKey && templates[templateKey]) {
        templateId = templateKey;
        const tmpl = templates[templateKey];
        content = tmpl.content;
        title = tmpl.name;

        if (templateKey === 'daily') {
          const mm = String(now.getMonth() + 1).padStart(2, '0');
          const dd = String(now.getDate()).padStart(2, '0');
          title = `每日待办${mm}${dd}`;
          content = inheritDailyTodo(content);
        }
      } else {
        content = "";
        title = "无标题便签";
      }

      const note = { id, title, templateId, updatedAt: iso, content };
      if (templateKey === 'daily') note._highlightInherit = true;

      notes.push(note);
      activeId = id;
      renderSidebar();
      renderEditor();

      if (templateKey === 'daily') {
        const hint = document.getElementById('inheritHint');
        hint.classList.add('show');
        setTimeout(() => hint.classList.remove('show'), 3000);
      }

      showSaveStatus('已保存');
    }

    function inheritDailyTodo(template) {
      const prev = notes
        .filter(n => n.templateId === 'daily')
        .sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt))[0];

      if (!prev) return template;

      const prevSections = parseSections(prev.content);
      const tmplSections = parseSections(template);

      let result = '';
      let currentSection = null;

      const lines = template.split('\n');
      for (let line of lines) {
        if (line.startsWith('#### ')) {
          currentSection = line.trim().replace(/^####\s+/, '');
          result += line + '\n\n';

          const prevSec = prevSections[currentSection];
          if (prevSec) {
            const items = prevSec.split('\n').filter(l => {
              const t = l.trim();
              if (!t.startsWith('- [') && !t.startsWith('* [')) return false;
              if (currentSection === '必做') return true;
              return t.includes('[ ]');
            });

            if (items.length > 0) {
              items.forEach(item => result += item + '\n');
            } else {
              result += '- [ ] \n';
            }
          } else {
            result += '- [ ] \n';
          }
          continue;
        }

        const t = line.trim();
        if (t === '- [ ]' || t === '- [ ] ' || t === '* [ ]' || t === '* [ ] ') continue;

        if (!currentSection || !t.startsWith('- [') && !t.startsWith('* [')) {
          result += line + '\n';
        }
      }

      return result;
    }

    function parseSections(content) {
      const sections = {};
      let currentName = '';
      let currentContent = '';
      content.split('\n').forEach(line => {
        if (line.startsWith('#### ')) {
          if (currentName) sections[currentName] = currentContent.trim();
          currentName = line.replace(/^####\s+/, '').trim();
          currentContent = '';
        } else if (currentName) {
          currentContent += line + '\n';
        }
      });
      if (currentName) sections[currentName] = currentContent.trim();
      return sections;
    }

    function showSaveStatus(text) {
      const el = document.getElementById('saveStatus');
      el.textContent = text;
      setTimeout(() => { el.textContent = ''; }, 2000);
    }

    function togglePin() {
      isPinned = !isPinned;
      document.getElementById('pinBtn').classList.toggle('active', isPinned);
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
    }

    function setOpacity(value) {
      document.documentElement.style.setProperty('--opacity', value / 100);
      document.getElementById('opacityValue').textContent = value + '%';
    }

    function dismissIntro() {
      document.getElementById('introToast').style.display = 'none';
    }

    // Initialize
    renderSidebar();
    renderEditor();
  </script>
</body>
</html>
